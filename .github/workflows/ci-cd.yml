name: CI-CD

on:
  push:
    branches:
      - main
      - feature/add-ci-cd

  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependências
        run: npm install

      - name: ESLint
        run: npm run lint

      - name: Testes unitários
        run: npm test

      - name: Cobertura de testes
        run: npm test -- --coverage